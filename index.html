<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }
    
    .iframe-wrapper {
      position: absolute;
      top: -58px; /* Memotong/menaikkan banner Google setinggi 58px ke atas layar */
      left: 0;
      width: 100%;
      height: calc(100% + 58px); /* Mengompensasi tinggi layar yang terpotong */
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="iframe-wrapper">
    <iframe src="https://script.google.com/macros/s/AKfycbzm29K9N1uhp7zAyWkpfA1SxAs_lczFdWzhEMi7ERX_AQV8BX6OzDBCtnMlSZa8Eli5/exec"></iframe>
  </div>

</body>
</html>
